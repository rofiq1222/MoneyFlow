<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MoneyFlow Finance Tracker</title><script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.min.js"></script><style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#172033;--muted:#6b7280;--line:#e5e7eb;--accent:#2563eb;--red:#dc2626;--green:#16a34a}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial;background:var(--bg);color:var(--ink)}button,input,select{font:inherit}.auth{min-height:100vh;display:grid;place-items:center;padding:20px}.authbox{width:min(420px,100%);background:#fff;padding:30px;border-radius:18px;box-shadow:0 12px 40px #00000012}.logo{font-size:25px;font-weight:800;margin-bottom:6px}.muted{color:var(--muted)}.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}.field label{font-size:13px;font-weight:650}.field input,.field select{padding:11px;border:1px solid #d8dde7;border-radius:9px;background:#fff}.btn{border:0;background:var(--accent);color:#fff;border-radius:9px;padding:10px 14px;cursor:pointer}.btn.secondary{background:#eef2ff;color:#1e3a8a}.btn.ghost{background:#f3f4f6;color:#111827}.btn.danger{background:#fee2e2;color:#991b1b}.full{grid-column:1/-1}.app{display:none;min-height:100vh}.sidebar{position:fixed;left:0;top:0;bottom:0;width:230px;background:#111827;color:#fff;padding:20px}.brand{font-weight:800;font-size:21px;margin-bottom:25px}.nav button{display:block;width:100%;text-align:left;border:0;background:transparent;color:#d1d5db;padding:11px 12px;border-radius:9px;margin:3px 0;cursor:pointer}.nav button.active,.nav button:hover{background:#263244;color:#fff}.main{margin-left:230px;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:20px}.period{display:flex;align-items:center;gap:7px}.period button{padding:7px 10px;border:1px solid var(--line);background:#fff;border-radius:8px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:17px}.label{font-size:12px;color:var(--muted)}.value{font-size:24px;font-weight:800;margin-top:5px}.green{color:var(--green)}.red{color:var(--red)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:14px}.section{margin-top:14px}.sectionhead,.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:11px 9px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;font-size:13px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px}.progress{height:8px;background:#eef0f4;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:var(--accent)}.modal{position:fixed;inset:0;background:#0007;display:none;place-items:center;padding:20px;z-index:20}.modalbox{background:#fff;border-radius:15px;padding:20px;width:min(650px,100%);max-height:90vh;overflow:auto}.filtergrid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:14px}.filtergrid input,.filtergrid select{padding:9px;border:1px solid #d8dde7;border-radius:8px}.small{font-size:12px}.empty{padding:30px;text-align:center;color:var(--muted)}@media(max-width:900px){.sidebar{position:static;width:auto;display:flex;overflow:auto;padding:10px}.brand{margin:0 15px 0 0}.nav{display:flex}.nav button{white-space:nowrap}.main{margin-left:0;padding:14px}.cards{grid-template-columns:1fr 1fr}.grid,.twocol{grid-template-columns:1fr}.filtergrid{grid-template-columns:1fr 1fr}.top{align-items:flex-start}.formgrid{grid-template-columns:1fr}}
</style></head><body><div id="root"></div><div id="modal" class="modal"><div class="modalbox"><div class="sectionhead"><h2 id="mtitle"></h2><button class="btn ghost" onclick="closeModal()">Tutup</button></div><div id="mbody"></div></div></div><script type="module" src="./app.js"></script></body></html>
